<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلب الطيف - ناجي رياض</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 30px rgba(255, 100, 150, 0.7));
            transition: filter 0.5s ease;
        }

        .input-wrapper {
            position: relative;
            width: 90%;
            max-width: 500px;
        }

        #textInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 22px;
            background: rgba(30, 30, 40, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #fff;
            text-align: center;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            direction: rtl;
            letter-spacing: 2px;
        }

        #textInput:focus {
            border-color: rgba(255, 100, 200, 0.8);
            box-shadow: 0 0 40px rgba(255, 50, 150, 0.5), inset 0 0 20px rgba(255, 100, 150, 0.2);
            background: rgba(20, 20, 30, 0.9);
        }

        #textInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            letter-spacing: 1px;
        }

        .hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* توقيع المبرمج */
        .programmer-signature {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        .signature-text {
            display: inline-block;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.9), rgba(40, 40, 55, 0.9));
            backdrop-filter: blur(15px);
            padding: 10px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        .signature-text span {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
            background-size: 200% auto;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        /* استجابة للشاشات الصغيرة */
        @media (max-width: 600px) {
            canvas {
                width: 300px;
                height: 300px;
            }
            #textInput {
                font-size: 18px;
                padding: 12px 18px;
            }
            .signature-text span {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="heartCanvas" width="400" height="400"></canvas>
        <div class="input-wrapper">
            <input type="text" id="textInput" placeholder="اكتب هنا... عربي أو English" maxlength="20" autofocus>
            <div class="hint">✨ كل حرف يُشكّل ألوان القلب ✨</div>
        </div>
    </div>

    <!-- توقيع المبرمج -->
    <div class="programmer-signature">
        <div class="signature-text">
            <span>👨‍💻 ناجي رياض</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            const input = document.getElementById('textInput');

            // ألوان الطيف الأساسية
            const spectrumColors = [
                '#ff0000', '#ff3300', '#ff6600', '#ff9900', '#ffcc00',
                '#ffff00', '#ccff00', '#99ff00', '#66ff00', '#33ff00',
                '#00ff00', '#00ff33', '#00ff66', '#00ff99', '#00ffcc',
                '#00ffff', '#00ccff', '#0099ff', '#0066ff', '#0033ff',
                '#0000ff', '#3300ff', '#6600ff', '#9900ff', '#cc00ff',
                '#ff00ff', '#ff00cc', '#ff0099', '#ff0066', '#ff0033'
            ];

            let particles = [];
            let animationId;
            let currentColors = ['#ff3366', '#ff6699', '#ff99cc']; // ألوان افتراضية

            // دالة هاش بسيطة لتحويل النص إلى ألوان
            function getColorsFromText(text) {
                if (!text || text.trim() === '') {
                    // إذا كان النص فارغاً، نرجع ألوان قوس قزح كاملة
                    return spectrumColors;
                }

                const colors = [];
                // نأخذ كل حرف ونحوله إلى لون من الطيف
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    // نتجاهل المسافات
                    if (char.trim() === '') continue;

                    const code = char.charCodeAt(0);
                    // نستخدم قيمة Unicode لتحديد مؤشر في مصفوفة الألوان
                    const index = code % spectrumColors.length;
                    colors.push(spectrumColors[index]);
                }

                // إذا لم نجد حروف صالحة، نرجع الألوان الافتراضية
                if (colors.length === 0) return spectrumColors;

                // نكرر الألوان ليكون لدينا عدد كافٍ للجسيمات
                const repeatedColors = [];
                while (repeatedColors.length < 50) {
                    repeatedColors.push(...colors);
                }
                return repeatedColors;
            }

            // دالة لتوليد نقاط على شكل قلب
            function generateHeartParticles(colors) {
                particles = [];
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const scale = 9; // حجم القلب

                const numParticles = Math.min(colors.length, 300);

                for (let i = 0; i < numParticles; i++) {
                    // معادلة بارامترية للقلب
                    const t = (i / numParticles) * Math.PI * 2;
                    // صيغة القلب: x = 16sin^3(t), y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

                    particles.push({
                        baseX: centerX + x * scale,
                        baseY: centerY - y * scale, // سالب لأن المحور y في canvas معكوس
                        x: centerX + x * scale,
                        y: centerY - y * scale,
                        color: colors[i % colors.length],
                        size: Math.random() * 2.5 + 1.5,
                        glowIntensity: Math.random() * 0.5 + 0.5,
                        phase: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.02 + 0.01
                    });
                }
            }

            // دالة الرسم والأنيميشن
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // رسم تأثير التوهج الخارجي على canvas منفصل (نستخدم shadow)
                ctx.shadowBlur = 0; // سنطبق التوهج يدوياً

                // رسم الجسيمات
                for (let p of particles) {
                    // حركة نبضية بسيطة حول النقطة الأساسية
                    const time = Date.now() * p.speed;
                    const offsetX = Math.sin(time + p.phase) * 3;
                    const offsetY = Math.cos(time + p.phase) * 3;

                    p.x = p.baseX + offsetX;
                    p.y = p.baseY + offsetY;

                    // طبقة التوهج الخارجي
                    ctx.save();
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15 * p.glowIntensity;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // النواة البيضاء اللامعة
                    ctx.save();
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // رسم خطوط متصلة بين الجسيمات القريبة لإضافة تأثير الشبكة
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 35) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                ctx.restore();

                animationId = requestAnimationFrame(animate);
            }

            // معالج إدخال النص
            input.addEventListener('input', function(e) {
                const text = e.target.value;
                currentColors = getColorsFromText(text);
                generateHeartParticles(currentColors);
            });

            // البدء عند تحميل الصفحة
            function init() {
                currentColors = spectrumColors;
                generateHeartParticles(currentColors);
                if (animationId) cancelAnimationFrame(animationId);
                animate();
            }

            // إعادة التحجيم إذا لزم الأمر
            window.addEventListener('resize', () => {
                // نحافظ على حجم canvas ثابت للتبسيط
            });

            // بدء التطبيق
            init();

            // تركيز تلقائي على حقل الإدخال
            input.focus();
        })();
    </script>
</body>
</html>
