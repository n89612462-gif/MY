<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 1000 دولار 😎</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            text-align: center;
        }
        .container {
            padding: 2.5rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #ff416c;
        }
        h1 { 
            color: #ff416c; 
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 65, 108, 0.7);
        }
        p { 
            font-size: 1.5rem; 
            color: #ccc;
        }
        .cost {
            font-size: 1.8rem;
            color: #00df9a;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>عمك ناجي 🤣</h1>
        <p>قال إيش؟ مستحيل تنشر موقع بلاش؟</p>
        <p>يلا هات 1000 دولار وبفتح لك موقع.. وإلا خليك ساكت 😂</p>
        <div class="cost">تكلفة نشر هذا الموقع: 0.00$</div>
    </div>
</body>
</html>
